version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge